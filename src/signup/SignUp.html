<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeCom Sign Up</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="flex min-h-screen items-center justify-center bg-gray-200 font-sans">
  <div class="w-96 rounded-lg bg-white p-10 text-center shadow-md transition-transform duration-200">
    <h1 class="text-3xl font-normal text-emerald-600">DeCom</h1>
    <h3 class="text-lg font-normal">Create your account</h3>

    <form id="signup-form" action="">
      <label for="name" class="mt-4 mb-2 block text-left font-bold text-gray-700">Name:</label>
      <input type="text" id="name" name="name"
             placeholder="Enter your Name"
             class="mb-6 block w-full rounded-md border border-gray-300 px-4 py-2 focus:border-emerald-400 focus:outline-none"
             required>

      <label for="email" class="mb-2 block text-left font-bold text-gray-700">Email:</label>
      <input type="email" id="email" name="email"
             placeholder="Enter your Email"
             class="mb-6 block w-full rounded-md border border-gray-300 px-4 py-2 focus:border-emerald-400 focus:outline-none"
             required>

      <label for="password" class="mb-2 block text-left font-bold text-gray-700">Password:</label>
      <input type="password" id="password" name="password"
             placeholder="At least 6 characters"
             class="mb-6 block w-full rounded-md border border-gray-300 px-4 py-2 focus:border-emerald-400 focus:outline-none"
             minlength="6" required>

      <label for="confirm-password" class="mb-2 block text-left font-bold text-gray-700">Confirm password:</label>
      <input type="password" id="confirm-password" name="confirm-password"
             placeholder="Re-enter your Password"
             class="mb-6 block w-full rounded-md border border-gray-300 px-4 py-2 focus:border-emerald-400 focus:outline-none"
             minlength="6" required>

      <div class="flex items-center justify-center">
        <button type="submit" id="signup-btn"
                class="cursor-pointer rounded-md bg-emerald-600 px-6 py-3 text-white transition-colors duration-300 hover:bg-emerald-500">
          Sign up
        </button>
      </div>
    </form>

    <p id="form-message" aria-live="polite"></p>

    <p class="mt-4">Already registered?
      <a href="#" id="go-login" class="text-blue-500 no-underline hover:underline">Log in</a>
    </p>
  </div>
</body>
</html>
