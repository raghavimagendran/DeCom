<div class="main">
  <h1 class="title">DeCom</h1>
  <h3 class="subtitle">Create your account</h3>

  <form id="signup-form" action="">
    <label for="name" class="form-label">Name:</label>
    <input type="text" id="name" name="name"
           placeholder="Enter your Name"
           class="form-input" required>

    <label for="email" class="form-label">Email:</label>
    <input type="email" id="email" name="email"
           placeholder="Enter your Email"
           class="form-input" required>

    <label for="password" class="form-label">Password:</label>
    <input type="password" id="password" name="password"
           placeholder="At least 6 characters"
           class="form-input" minlength="6" required>

    <label for="confirm-password" class="form-label">Confirm password:</label>
    <input type="password" id="confirm-password" name="confirm-password"
           placeholder="Re-enter your Password"
           class="form-input" minlength="6" required>

    <div class="form-actions">
      <button type="submit" id="signup-btn" class="btn-submit">Sign up</button>
    </div>
  </form>

  <p id="form-message" class="form-message" aria-live="polite"></p>

  <p class="register-text">Already registered?
    <a href="#" id="go-login" class="register-link">Log in</a>
  </p>
</div>
