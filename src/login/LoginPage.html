<div class="main">
  <h1 class="title">DeCom</h1>
  <h3 class="subtitle">Enter your login credentials</h3>

  <form id="login-form" action="">
    <label for="email" class="form-label">Email:</label>
    <input type="email" id="email" name="email"
           placeholder="Enter your Email"
           class="form-input" required>

    <label for="password" class="form-label">Password:</label>
    <input type="password" id="password" name="password"
           placeholder="Enter your Password"
           class="form-input" required>

    <div class="form-actions">
      <button type="submit" id="login-btn" class="btn-submit">Submit</button>
    </div>
  </form>

  <p id="form-message" class="form-message" aria-live="polite"></p>

  <p class="register-text">Not registered?
  <a href="#" id="go-signup" class="register-link">Create an account</a>
</p>
</div>
